name: Rust semver-checks

on:
    pull_request:
        branches:
            - master
        types:
            - opened
            - edited
            - synchronize
            - reopened
    workflow_dispatch:
        inputs:
            base:
                description: 'Base branch or tag to run the semver checks against.'
                required: true
                default: 'master'

# PR code is built below, so this workflow must also work with a read-only fork token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  semver-checks:
    name: semver-checks 🦀
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: PR_BRANCH
          persist-credentials: false
      - name: Checkout baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.inputs.base }}
          path: BASELINE_BRANCH
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Install a prebuilt binary of cargo-semver-checks
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-semver-checks
        run: cargo binstall -y cargo-semver-checks

      - name: Check for build errors
        working-directory: PR_BRANCH
        run: cargo check

      # Diagnostics go to the job summary: fork PR tokens cannot write PR comments.
      - name: Check for public API changes
        working-directory: PR_BRANCH
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          cargo semver-checks --color never --baseline-root ../BASELINE_BRANCH --release-type minor > diagnostic.txt 2>&1 || status=$?
          cat diagnostic.txt

          breaking_declared=false
          if [[ "$PR_TITLE" =~ ^.*\!:.*$ ]]; then
            breaking_declared=true
          fi

          {
            echo '### Rust semver-checks'
            case "$status" in
              0)
                echo 'No breaking changes to the public Rust API were detected.'
                ;;
              100)
                if [[ "$breaking_declared" == true ]]; then
                  echo 'Breaking changes were detected and declared in the PR title.'
                else
                  echo 'Breaking changes were detected. Deprecate the old API or mark the PR title with `!` following Conventional Commits.'
                fi
                ;;
              *)
                echo 'The semver check could not complete. See the diagnostic below.'
                ;;
            esac
            echo
            echo '<details><summary>cargo-semver-checks diagnostic</summary>'
            echo
            echo '````text'
            cat diagnostic.txt
            echo
            echo '````'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$status" in
            0) ;;
            100)
              if [[ "$breaking_declared" != true ]]; then
                echo '::error::Undeclared breaking changes to the public Rust API.'
                exit 1
              fi
              ;;
            *) exit "$status" ;;
          esac
